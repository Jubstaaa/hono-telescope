services:
    app:
        image: ghcr.io/jubstaaa/hono-telescope:${IMAGE_TAG:-latest}
        container_name: hono-telescope
        restart: unless-stopped
        mem_limit: 256m
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O /dev/null -T 3 "http://127.0.0.1:3000/" || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
            start_interval: 2s
        environment:
            NODE_ENV: production
        ports:
            - '127.0.0.1:3006:3000'
