version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          # react and react-dom refuse to run at different versions.
          react:
              patterns:
                  ['react', 'react-dom', '@types/react', '@types/react-dom']
          vite:
              patterns: ['vite', '@vitejs/*']
          eslint:
              patterns: ['eslint', '@eslint/*']
          typescript-eslint:
              patterns: ['typescript-eslint', '@typescript-eslint/*']
      ignore:
          # The `typescript` key is the TypeScript 6 API alias that
          # typescript-eslint needs; TypeScript 7 arrives through
          # @typescript/native, which is not ignored.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # Tracks engines.node (the oldest supported LTS), not the newest Node.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
    # Keeps the pinned oven/bun base image current; never auto-merged.
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
