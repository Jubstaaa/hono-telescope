name: Release please

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        steps:
            # RELEASE_TOKEN, not GITHUB_TOKEN: a pull request opened with the
            # built-in token does not start workflows, so its required checks
            # would never report and the release would sit blocked.
            - id: app
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              with:
                  app-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  release-type: node
                  token: ${{ steps.app.outputs.token }}
                  include-v-in-tag: false
