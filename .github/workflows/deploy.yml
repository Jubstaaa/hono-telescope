name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test
      # Gates the published artifact: dist has to import under both Node and Bun.
      # The package once shipped unimportable on Node for want of this check.
      - run: bun run publishBuild

  build:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both tags are for humans — `docker pull`, the package page, a manual run.
      # The droplet is pinned to this step's digest, see the deploy job.
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jubstaaa/hono-telescope:latest
            ghcr.io/jubstaaa/hono-telescope:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # checkout needs contents; naming any permission replaces the defaults,
      # so omitting it leaves the deploy job unable to read its own repository.
      contents: read
      packages: read
    steps:
      # The compose file is the repository's, not the server's. Without this
      # step `docker compose up` reads whatever happens to be on the droplet,
      # so the two drift the moment anyone edits either one — and the drift is
      # silent, because a deploy still succeeds against the stale copy.
      - uses: actions/checkout@v7
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/hono-telescope
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_DIGEST
          # `set -e` because the last command used to decide the step's fate: a
          # failing pull was masked by `docker image prune -f` exiting 0.
          #
          # The retry is not defensive padding. GHCR needs up to a minute after a
          # push before it serves the new manifest, by tag or by digest: a pull
          # 30s in resolved `:latest` to the previous image (twice, silently) and
          # a pull 40s in answered `not found` for the digest, while one 89s in
          # succeeded. So the deploy waits for the registry rather than shipping
          # whatever it happens to have.
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/hono-telescope
            printf 'TELESCOPE_IMAGE=ghcr.io/jubstaaa/hono-telescope@%s\n' "$IMAGE_DIGEST" > .env
            attempt=1
            until docker compose pull; do
              if [ "$attempt" -ge 6 ]; then
                echo "the registry never served $IMAGE_DIGEST after $attempt attempts" >&2
                exit 1
              fi
              echo "pull attempt $attempt failed; the manifest may not be live yet, retrying in 20s"
              attempt=$((attempt + 1))
              sleep 20
            done
            docker compose up -d
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
