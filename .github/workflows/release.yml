name: Release

on:
    push:
        tags: ['v*']

jobs:
    publish:
        environment: release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            - run: bun install --frozen-lockfile
            - run: bun run build:dashboard
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run format:check
            - run: bun run audit

            - run: bun run publishBuild

            - name: Verify the tag matches package.json
              run: |
                  TAG="$GITHUB_REF_NAME"
                  PKG=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "$PKG" ]; then
                    echo "Tag $TAG does not match package.json version $PKG"
                    exit 1
                  fi

            - name: Publish to npm
              run: |
                  PKG=$(node -p "require('./package.json').name")
                  VER=$(node -p "require('./package.json').version")
                  if npm view "$PKG@$VER" version >/dev/null 2>&1; then
                    echo "$PKG@$VER is already on npm; nothing to publish."
                    exit 0
                  fi
                  npm publish

            - name: Publish the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
                    exit 0
                  fi
                  VERSION="${GITHUB_REF_NAME#v}"
                  awk -v ver="## [$VERSION]" '
                    index($0, ver) == 1 { grab = 1; next }
                    grab && /^## \[/    { exit }
                    grab                { print }
                  ' CHANGELOG.md > /tmp/notes.md
                  if [ ! -s /tmp/notes.md ]; then
                    echo "No changelog entry for $VERSION" >&2
                    exit 1
                  fi
                  gh release create "$GITHUB_REF_NAME" --title "Release v$VERSION" \
                    --notes-file /tmp/notes.md --verify-tag --latest
