name: CI

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            # The package's minimum supported Node (engines.node); verify:dist imports
            # dist under it.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - run: bun install --frozen-lockfile
            # The dashboard bundle is inlined into a generated module the library imports; it is
            # not committed, so typecheck and the tests need it built first.
            - run: bun run build:dashboard
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run audit
            # Gates the published artifact: dist has to import under both Node and Bun.
            # The package once shipped unimportable on Node for want of this check.
            - run: bun run publishBuild
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
